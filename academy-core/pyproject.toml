[project]
name = "academy-core"
version = "0.1.0"
description = "Shared runtime for AMD AI Academy challenge containers: LLM client, harness contract, deadlines, logging, model-server bootstrap"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "pydantic-settings>=2.2"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
hf = ["transformers>=4.46", "accelerate>=0.34"]

[project.scripts]
academy-entrypoint = "academy_core.server.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academy_core"]
